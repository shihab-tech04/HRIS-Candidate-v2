name: WS05 Candidate CA02-04 independent source recovery
on:
  push:
    branches: [recovery/ws05-candidate-ca02-04-prerelease-20261031]
permissions:
  contents: read
jobs:
  source-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source, restore all Git history, and checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          before='5c03fddd2511a49e92687c0fb0e9b4d57f7500a3'
          test "$(git rev-parse refs/remotes/origin/main)" = "$before"
          git cat-file -e "$before^{commit}"
          git bundle create "$RUNNER_TEMP/candidate-prerelease-full-history.bundle" --all HEAD
          git bundle verify "$RUNNER_TEMP/candidate-prerelease-full-history.bundle"
          git clone -q "$RUNNER_TEMP/candidate-prerelease-full-history.bundle" "$RUNNER_TEMP/isolated-restore"
          git -C "$RUNNER_TEMP/isolated-restore" cat-file -e "$before^{commit}"
          test "$(git -C "$RUNNER_TEMP/isolated-restore" cat-file -p "$before" | wc -c)" -gt 100
          git -C "$RUNNER_TEMP/isolated-restore" fsck --full --strict
          printf 'repository=shihab-tech04/HRIS-Candidate-v2\npre_release_main=%s\nbackup_workflow_ref=%s\n' "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/candidate-prerelease-manifest.txt"
          (cd "$RUNNER_TEMP" && sha256sum candidate-prerelease-full-history.bundle candidate-prerelease-manifest.txt > candidate-prerelease-SHA256.txt && sha256sum -c candidate-prerelease-SHA256.txt)
          echo "PASS: pre-release source history bundle restored and verified"
      - name: Upload verified recovery copy for independent off-GitHub preservation
        uses: actions/upload-artifact@v4
        with:
          name: ws05-candidate-prerelease-ca02-04-source
          path: |
            ${{ runner.temp }}/candidate-prerelease-full-history.bundle
            ${{ runner.temp }}/candidate-prerelease-manifest.txt
            ${{ runner.temp }}/candidate-prerelease-SHA256.txt
          if-no-files-found: error
          retention-days: 30
