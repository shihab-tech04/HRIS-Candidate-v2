name: Candidate privacy and full journey acceptance (disposable only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/api.ts'
      - 'src/pages/VerifiedApplyPage.tsx'
      - 'tests/candidate-application-local-e2e.mjs'
      - '.github/workflows/candidate-auth-postgres-acceptance.yml'
  push:
    branches: [development/hris-checkpoints, release/candidate-stable-20261017, work/candidate-phase06-07-20261020, integration/ws05-candidate-final-review-20261022, integration/ws05-candidate-nav-e2e-review-20261023]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # On pull_request, github.ref is refs/pull/<number>/merge; refs/heads/* groups isolate branch runs.
  group: candidate-disposable-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-auth-postgres:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/integration/ws05-candidate-nav-e2e-review-20261023' || github.ref == 'refs/heads/integration/ws05-candidate-final-review-20261022' || github.ref == 'refs/heads/development/hris-checkpoints' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'push' && (github.ref == 'refs/heads/release/candidate-stable-20261017' || github.ref == 'refs/heads/work/candidate-phase06-07-20261020'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: '1'
      HRIS_DOCKER_CONTEXT: default
      HRIS_MAIN_REPO_ROOT: ${{ github.workspace }}/../HRIS-v2
      HRIS_MAIN_REF: '15de3600d921ad0efb7efada401bd04a7c7383e1'
      HRIS_CANDIDATE_C1_TEST_WORKDIR: /tmp/synesis-candidate-c1-auth-github
      HRIS_CANDIDATE_C1_API_PORT: '55721'
      HRIS_CANDIDATE_C1_DB_PORT: '55722'
      SUPABASE_HOME: /tmp/synesis-supabase-home
      SUPABASE_TELEMETRY_DISABLED: '1'
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the protected Main contract for disposable database fixtures
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --no-checkout https://github.com/shihab-tech04/HRIS-v2.git "$HRIS_MAIN_REPO_ROOT"
          git -C "$HRIS_MAIN_REPO_ROOT" fetch --no-tags --depth 1 origin "$HRIS_MAIN_REF"
          git -C "$HRIS_MAIN_REPO_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$HRIS_MAIN_REPO_ROOT" rev-parse HEAD)" = "$HRIS_MAIN_REF"
      - name: Record the trusted HRIS source revision used for Candidate security fixtures
        run: git -C "$HRIS_MAIN_REPO_ROOT" rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Install Candidate and HRIS test dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          npm install --include=optional --no-audit --no-fund --prefix "$HRIS_MAIN_REPO_ROOT"
      - name: Create a dedicated local Candidate Auth and Postgres stack
        run: |
          set -euo pipefail
          mkdir -p "$HRIS_CANDIDATE_C1_TEST_WORKDIR"
          supabase init --workdir "$HRIS_CANDIDATE_C1_TEST_WORKDIR" --force >/dev/null
          sed -i 's/^port = 54321$/port = 55721/' "$HRIS_CANDIDATE_C1_TEST_WORKDIR/supabase/config.toml"
          sed -i 's/^port = 54322$/port = 55722/' "$HRIS_CANDIDATE_C1_TEST_WORKDIR/supabase/config.toml"
          grep -q '^project_id = "synesis-candidate-c1-auth-github"$' "$HRIS_CANDIDATE_C1_TEST_WORKDIR/supabase/config.toml"
          if ! supabase start --workdir "$HRIS_CANDIDATE_C1_TEST_WORKDIR" --exclude studio,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/candidate-supabase-start.log" 2>&1; then
            echo "Disposable Candidate Supabase CLI start failed on ubuntu-24.04. Generated local keys and service logs are suppressed."
            docker ps --format '{{.Names}} {{.Status}}' | sed -n '/synesis-candidate-c1-auth-github/p' || true
            exit 1
          fi
          echo "Disposable Candidate Auth/Postgres/Storage services are ready; generated keys were not written to logs."
      - name: Install Chromium for isolated Candidate browser acceptance
        working-directory: ../HRIS-v2
        run: npx playwright install --with-deps chromium
      - name: Verify the real Candidate stage-history RLS and grants with synthetic Auth users
        working-directory: ../HRIS-v2
        run: node tests/sql/candidate-c1/run-local-tenant-auth.mjs
      - name: Verify Candidate profile privacy and recovery in local Auth/Postgres
        run: node tests/candidate-profile-local-e2e.mjs
      - name: Verify Candidate application and employee-transition journeys in local Auth/Postgres
        run: node tests/candidate-application-local-e2e.mjs
      - name: Run Candidate route, localization, type and build regressions
        run: |
          set -euo pipefail
          bun test ./tests/*.test.*
          npm run test:routes
          bun run lint
          bunx vite build --base=/HRIS-Candidate-v2/
          test -s dist/index.html
          grep -Eq 'src="/HRIS-Candidate-v2/assets/[^\"]+\.js"' dist/index.html
          grep -Eq 'href="/HRIS-Candidate-v2/assets/[^\"]+\.css"' dist/index.html
      - name: Stop only the disposable Candidate Supabase project
        if: always()
        run: supabase stop --workdir "$HRIS_CANDIDATE_C1_TEST_WORKDIR" --no-backup >/dev/null 2>&1 || true
