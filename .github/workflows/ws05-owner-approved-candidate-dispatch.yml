name: WS05 one-shot user-approved Candidate release dispatch
on:
  push:
    branches: [release/ws05-owner-approved-candidate-db416-20261031]
    paths:
      - .github/workflows/ws05-owner-approved-candidate-dispatch.yml
permissions:
  actions: write
  contents: read
jobs:
  authorized-dispatch:
    if: github.ref == 'refs/heads/release/ws05-owner-approved-candidate-db416-20261031' && github.event.head_commit.message == 'chore(release): one-shot owner-approved Candidate workflow dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing protected Candidate Pages workflow at exact Main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expected = 'db4163885f9609d66e9871a9c0de771fe8151d84';
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== expected || branch.data.protected !== true) {
              core.setFailed('Main changed or is no longer protected; no release dispatched.');
              return;
            }
            // Owner explicitly authorized production release in ChatGPT, 2026-10-31.
            // Exact Main build & independent Git restore PASS; off-GitHub backup:
            // https://drive.google.com/file/d/1rbLT4aPAxJti_OlPhCbh6VwOBa9li3RD/view?usp=drivesdk
            // Only dispatch the existing manually gated release. Do not change
            // or bypass the protected production workflow or its test gates.
            const prior = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'release-preview.yml', branch: 'main', per_page: 8,
            });
            if (prior.data.workflow_runs.some(run => run.head_sha === expected && ['queued','in_progress','waiting'].includes(run.status))) {
              core.notice('Matching production release already active; refusing duplicate.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'release-preview.yml', ref: 'main',
              inputs: { release_approved: 'true' },
            });
            core.notice('Existing Candidate protected main release dispatched at ' + expected);
