name: WS05 one-time approved Candidate deadline feature release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ws05-approved-candidate-deadline-dispatch-20261024.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-approved-release:
    if: github.repository == 'shihab-tech04/HRIS-Candidate-v2' && github.ref == 'refs/heads/main' && github.actor == 'shihab-tech04'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify feature-only release source, protected Main lineage and existing privacy gate
        shell: bash
        run: |
          set -euo pipefail
          base=4420de07726ccd8c2c6a9b47f13a08646267f499
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = '.github/workflows/ws05-approved-candidate-deadline-dispatch-20261024.yml'
          grep -Fq "VITE_CANDIDATE_PUBLIC_ONLY: 'true'" .github/workflows/release-preview.yml
          grep -Fq "inputs.release_approved == true" .github/workflows/release-preview.yml
          grep -Fq "workflow_dispatch:" .github/workflows/release-preview.yml
          grep -Fq "isRecruitmentDeadlineOpen(job.application_deadline)" src/lib/api.ts
          grep -Fq "isRecruitmentDeadlineOpen(j.application_deadline)" src/lib/api.ts
          echo 'Candidate public-only and approved feature source verified'
      - name: Trigger existing manually gated owner-approved release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-preview.yml/dispatches" \
            -f ref=main \
            -F 'inputs[release_approved]=true'
          echo 'Approved Candidate public-only release dispatched'
