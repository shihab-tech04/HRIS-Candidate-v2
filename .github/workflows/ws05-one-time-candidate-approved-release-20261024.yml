name: One-time exact-main approved Candidate Pages release
on:
  push:
    branches: [release/candidate-utc-deadline-approved-20261024]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-reviewed-release:
    if: github.ref == 'refs/heads/release/candidate-utc-deadline-approved-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Guard the exact protected main version and approved public-only release
        shell: bash
        env:
          EXPECTED_MAIN: '39d07585c854709f5c16b2712a6634da386c5c4d'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git show "FETCH_HEAD:src/lib/recruitmentDeadline.ts" | grep -F 'formatRecruitmentDeadlineDate'
          git show "FETCH_HEAD:.github/workflows/release-preview.yml" | grep -F "VITE_CANDIDATE_PUBLIC_ONLY: 'true'"
          git show "FETCH_HEAD:.github/workflows/release-preview.yml" | grep -F "github.ref == 'refs/heads/main' && inputs.release_approved == true"
      - name: Dispatch the existing owner-approved main-only release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/actions/workflows/release-preview.yml/dispatches" \
            --input - <<'JSON'
          {"ref":"main","inputs":{"release_approved":true}}
          JSON
          echo "Dispatched the existing protected-main Candidate workflow; GitHub Actions and live asset checks still determine release success."
