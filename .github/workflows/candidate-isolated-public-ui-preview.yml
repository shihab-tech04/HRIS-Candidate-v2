name: Candidate isolated public UI preview package (no deploy)
on:
  push:
    branches: ['work/candidate-public-ui-preview-20261021']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: Build public-only isolated Candidate preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Verify Candidate public route contracts
        run: npm run lint
      - name: Remove source fallback to production Supabase for preview build
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='src/lib/supabase.ts';
          const source=fs.readFileSync(path,'utf8');
          const original="'https://oslgwxaqfbteqtwqvdzs.supabase.co'";
          if (!source.includes(original)) throw new Error('Production fallback changed; re-audit before preview');
          fs.writeFileSync(path,source.replace(original,"'https://preview-disabled.invalid'"));
          NODE
      - name: Build Candidate-only preview with production backend disabled
        env:
          VITE_CANDIDATE_PUBLIC_ONLY: 'true'
          VITE_SUPABASE_URL: 'https://preview-disabled.invalid'
          VITE_SUPABASE_ANON_KEY: 'preview-backend-disabled'
        run: npx vite build --base=/
      - name: Ensure all generated code uses the isolated disabled API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const walk = directory => fs.readdirSync(directory,{withFileTypes:true}).flatMap(item => {
            const target=path.join(directory,item.name);
            return item.isDirectory() ? walk(target) : [target];
          });
          for(const file of walk('dist').filter(value=>/\.(js|css|html|json)$/.test(value))){
            const src=fs.readFileSync(file,'utf8');
            const safe=src.replaceAll('https://oslgwxaqfbteqtwqvdzs.supabase.co','https://preview-disabled.invalid').replaceAll('oslgwxaqfbteqtwqvdzs','no-production-endpoint');
            if(safe!==src) fs.writeFileSync(file,safe);
          }
          NODE
      - name: Verify public-only build output
        shell: bash
        run: |
          test -s dist/index.html
          test -d dist/assets
          if grep -R -q 'oslgwxaqfbteqtwqvdzs' dist; then
            echo 'Production HRIS URL unexpectedly present in isolated Candidate preview' >&2
            exit 1
          fi
          find dist -type f -printf '%p %s bytes\n'
      - name: Publish generated static assets to isolated preview branch only
        shell: bash
        run: |
          mkdir -p preview-dist
          cp -a dist/. preview-dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview-dist
          if ! git diff --cached --quiet; then
            git commit -m "build(preview): Candidate public-only static UI"
            git push origin HEAD:work/candidate-public-ui-preview-20261021
          fi
      - name: Save isolated public Candidate build
        uses: actions/upload-artifact@v4
        with:
          name: candidate-isolated-public-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
