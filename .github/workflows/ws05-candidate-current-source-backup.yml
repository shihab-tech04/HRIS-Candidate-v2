name: WS05 Candidate final source recovery bundle (no deploy)
on:
  push:
    branches: [integration/ws05-candidate-final-review-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-git-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full history, bundle, checksum and offline restoration
        shell: bash
        env:
          SOURCE_SHA: '393eb276aa3cef0fdb1a7ac27dd58086f67bd827'
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "$SOURCE_SHA^{commit}"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "$MAIN_SHA^{commit}"
          git bundle create "$RUNNER_TEMP/hris-candidate-complete-history.git.bundle" --all HEAD
          git bundle verify "$RUNNER_TEMP/hris-candidate-complete-history.git.bundle"
          git clone -q "$RUNNER_TEMP/hris-candidate-complete-history.git.bundle" "$RUNNER_TEMP/restore-check"
          git -C "$RUNNER_TEMP/restore-check" cat-file -e "$SOURCE_SHA^{commit}"
          git -C "$RUNNER_TEMP/restore-check" cat-file -e "$MAIN_SHA^{commit}"
          printf 'repository=%s\nsource_sha=%s\nbackup_branch_sha=%s\nproduction_main_sha=%s\n' 'shihab-tech04/HRIS-Candidate-v2' "$SOURCE_SHA" "$GITHUB_SHA" "$MAIN_SHA" > "$RUNNER_TEMP/hris-candidate-manifest.txt"
          (cd "$RUNNER_TEMP" && sha256sum hris-candidate-complete-history.git.bundle hris-candidate-manifest.txt > hris-candidate-SHA256.txt && sha256sum -c hris-candidate-SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: hris-candidate-current-integration-complete-source-history
          path: |
            ${{ runner.temp }}/hris-candidate-complete-history.git.bundle
            ${{ runner.temp }}/hris-candidate-manifest.txt
            ${{ runner.temp }}/hris-candidate-SHA256.txt
          if-no-files-found: error
          retention-days: 30
