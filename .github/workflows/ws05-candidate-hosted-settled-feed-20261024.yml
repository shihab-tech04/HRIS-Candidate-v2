name: Candidate settled production vacancy API and EN/BN browser acceptance
on:
  push:
    branches: [validation/candidate-hosted-browser-20261024]
permissions:
  contents: read
jobs:
  hosted-settled-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up headless Chromium
        run: |
          npm install --no-save --no-package-lock --include=optional --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Require real hosted vacancy-read success and settled EN/BN empty state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { mkdir } from 'node:fs/promises';
          const base='https://shihab-tech04.github.io/HRIS-Candidate-v2/';
          const browser=await chromium.launch({headless:true});
          await mkdir('settled-feed-evidence',{recursive:true});
          try {
            for (const width of [375,768,1280,1920]) {
              const page=await browser.newPage({viewport:{width,height:900}});
              const errors=[];
              const jobResponses=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',response=>{
                if(response.url().includes('/rest/v1/candidate_published_jobs'))jobResponses.push(response.status());
              });
              const initial=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(initial?.status(),200);
              await page.getByRole('heading',{name:'No vacancies found'}).waitFor({state:'visible',timeout:30000});
              assert.ok(jobResponses.includes(200),'Published vacancies API did not return an authenticated-independent HTTP 200');
              assert.equal(await page.getByText('Fetching active vacancies...').count(),0,'Candidate feed never settled');
              assert.equal(errors.length,0,'Production React error '+errors.join(';'));
              let doc=await page.evaluate(()=>document.documentElement.scrollWidth);
              assert.ok(doc<=width+1,'English overflow width '+width+' doc '+doc);
              await page.screenshot({path:'settled-feed-evidence/actual-settled-en-'+width+'.png',fullPage:true});
              await page.getByRole('button',{name:'Switch to Bengali'}).click();
              await page.getByRole('heading',{name:'কোনো চাকরির বিজ্ঞপ্তি পাওয়া যায়নি'}).waitFor({state:'visible',timeout:15000});
              doc=await page.evaluate(()=>document.documentElement.scrollWidth);
              assert.ok(doc<=width+1,'Bengali overflow width '+width+' doc '+doc);
              await page.screenshot({path:'settled-feed-evidence/actual-settled-bn-'+width+'.png',fullPage:true});
              console.log('PASS_SETTLED_HOSTED_JOBS',width,'api_status',jobResponses.join(','),'en_and_bn');
              await page.close();
            }
            console.log('PASS: real hosted anonymous vacancy API HTTP 200 and settled EN/BN empty state at all viewports');
          }finally{await browser.close();}
          NODE
      - name: Save exact settled hosted screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-hosted-settled-feed-20261024
          path: settled-feed-evidence/
          retention-days: 14
          if-no-files-found: ignore
