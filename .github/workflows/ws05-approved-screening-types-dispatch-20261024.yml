name: WS05 one-time approved Candidate screening-type release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ws05-approved-screening-types-dispatch-20261024.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-approved-release:
    if: github.repository == 'shihab-tech04/HRIS-Candidate-v2' && github.ref == 'refs/heads/main' && github.actor == 'shihab-tech04'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed feature and production privacy gates
        shell: bash
        run: |
          set -euo pipefail
          base=1684d8f98006ecea92e5447ca1b0276553eb77a3
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = '.github/workflows/ws05-approved-screening-types-dispatch-20261024.yml'
          grep -Fq "VITE_CANDIDATE_PUBLIC_ONLY: 'true'" .github/workflows/release-preview.yml
          grep -Fq 'inputs.release_approved == true' .github/workflows/release-preview.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/release-preview.yml
          grep -Fq "mapSqlScreeningQuestionType(q.type)" src/lib/api.ts
          grep -Fq "parseScreeningNumberInput(e.target.value)" src/pages/VerifiedApplyPage.tsx
          test -f tests/candidate-screening-sql-parity.test.ts
          echo 'Exact protected Candidate screening feature and public-only gate verified'
      - name: Dispatch existing owner-approved Candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-preview.yml/dispatches" \
            -f ref=main \
            -F 'inputs[release_approved]=true'
          echo 'Approved Candidate release dispatched'
