name: Candidate exact-main portable source recovery (no deploy)
on:
  push:
    branches: [recovery/verified-candidate-source-20261024]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact production source and restore portable Git archive
        shell: bash
        env:
          EXPECTED_MAIN_SHA: '39d07585c854709f5c16b2712a6634da386c5c4d'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"
          git bundle create "$RUNNER_TEMP/hris-candidate-complete-source.git.bundle" --all HEAD
          git bundle verify "$RUNNER_TEMP/hris-candidate-complete-source.git.bundle"
          git clone --quiet "$RUNNER_TEMP/hris-candidate-complete-source.git.bundle" "$RUNNER_TEMP/candidate-recovery-check"
          git -C "$RUNNER_TEMP/candidate-recovery-check" cat-file -e "$EXPECTED_MAIN_SHA^{commit}"
          git -C "$RUNNER_TEMP/candidate-recovery-check" checkout --detach "$EXPECTED_MAIN_SHA"
          test -s "$RUNNER_TEMP/candidate-recovery-check/src/lib/recruitmentDeadline.ts"
          git archive --format=tar --prefix=HRIS-Candidate-v2/ "$EXPECTED_MAIN_SHA" | gzip -n > "$RUNNER_TEMP/hris-candidate-exact-main.tar.gz"
          printf 'repository=%s\nsource_commit=%s\nsource_branch=%s\nbundle_restored=yes\n' 'shihab-tech04/HRIS-Candidate-v2' "$EXPECTED_MAIN_SHA" 'main' > "$RUNNER_TEMP/hris-candidate-exact-source-manifest.txt"
          (cd "$RUNNER_TEMP" && sha256sum hris-candidate-complete-source.git.bundle hris-candidate-exact-main.tar.gz hris-candidate-exact-source-manifest.txt > hris-candidate-exact-main.sha256 && sha256sum -c hris-candidate-exact-main.sha256)
      - name: Retain portable, checksum-verified source for external preservation
        uses: actions/upload-artifact@v4
        with:
          name: hris-candidate-exact-main-20261024
          path: |
            ${{ runner.temp }}/hris-candidate-complete-source.git.bundle
            ${{ runner.temp }}/hris-candidate-exact-main.tar.gz
            ${{ runner.temp }}/hris-candidate-exact-source-manifest.txt
            ${{ runner.temp }}/hris-candidate-exact-main.sha256
          retention-days: 30
          if-no-files-found: error
