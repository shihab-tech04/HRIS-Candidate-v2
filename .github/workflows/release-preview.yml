name: Candidate-v2 verified GitHub Pages release
on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: Confirm that the owner has explicitly approved this production release.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-v2-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.release_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Restore immutable reviewed Main HRIS story catalogue
        run: |
          set -euo pipefail
          expected_sha=aefa24196b973db586e754d1f7fa20fab49b29b7
          git clone --quiet --depth 1 --branch integration/ws05-main-final-review-20261022 https://github.com/shihab-tech04/HRIS-v2.git ../HRIS-v2
          if [ "$(git -C ../HRIS-v2 rev-parse HEAD)" != "$expected_sha" ]; then
            git -C ../HRIS-v2 fetch --no-tags --depth 1 origin "$expected_sha"
            git -C ../HRIS-v2 checkout --detach "$expected_sha"
          fi
          test -s ../HRIS-v2/docs/programme/recovered-source/CANONICAL_USER_STORY_MATRIX.json
          test "$(git -C ../HRIS-v2 rev-parse HEAD)" = "$expected_sha"
      - run: bun test
      - run: npm run test:routes
      - run: bun run lint
      - name: Build compiled Candidate-v2 Pages artifact
        env:
          VITE_SUPABASE_URL: https://xfuxnljfrgvusbrpvxpa.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_4xzRp7eeyLuj1fQmmx_Vtw_-g_4MeCT
          VITE_ENABLE_DEMO_MODE: 'false'
          VITE_CANDIDATE_PUBLIC_ONLY: 'true'
        run: |
          bunx vite build --base=/HRIS-Candidate-v2/
          test -s dist/index.html
          cp dist/index.html dist/404.html
          grep -Eq 'src="/HRIS-Candidate-v2/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/HRIS-Candidate-v2/assets/[^"]+\.css"' dist/index.html
          ! grep -Eq 'src="/src/main\.tsx"|/HRIS-Candidate/assets/' dist/index.html
          grep -Fq 'id="root"' dist/index.html
          ! grep -q '/src/assets/images/' dist/index.html
          ! grep -q 'VITE_CANDIDATE_PUBLIC_ONLY' dist/index.html
      - name: Upload compiled GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.release_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://shihab-tech04.github.io/HRIS-Candidate-v2/
    steps:
      - name: Deploy compiled bundle
        uses: actions/deploy-pages@v4
      - name: Verify served HTML, compiled JavaScript and CSS
        env:
          BASE_URL: https://shihab-tech04.github.io/HRIS-Candidate-v2/
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$BASE_URL" -o live.html &&
              grep -q '/HRIS-Candidate-v2/assets/' live.html &&
              ! grep -q '/HRIS-Candidate/assets/' live.html; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Pages did not serve the compiled Candidate-v2 bundle" >&2
              exit 1
            fi
            sleep 10
          done
          js="$(grep -oE '/HRIS-Candidate-v2/assets/[^"]+\.js' live.html | head -n1)"
          css="$(grep -oE '/HRIS-Candidate-v2/assets/[^"]+\.css' live.html | head -n1)"
          test -n "$js" && test -n "$css"
          curl -fsSL "https://shihab-tech04.github.io$js" -o live.js
          curl -fsSL "https://shihab-tech04.github.io$css" -o live.css
          test -s live.js && test -s live.css
          echo "Served compiled HTML, JavaScript and CSS verified."
