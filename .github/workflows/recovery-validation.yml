name: Candidate-v2 recovery validation (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - '404.html'
      - 'vite.config.ts'
      - '.github/workflows/release-preview.yml'
      - '.github/workflows/recovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: UX/UI v8 approved-change inventory (diagnostic, not acceptance)
        run: |
          node scripts/product-integrity-gate.mjs --mode=self-test
          node scripts/product-integrity-gate.mjs --mode=pr
          node scripts/product-integrity-gate.mjs --mode=audit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      - name: Compile and verify Candidate-v2 Pages paths without deployment
        run: |
          bunx vite build --base=/HRIS-Candidate-v2/
          test -s dist/index.html
          grep -Eq 'src="/HRIS-Candidate-v2/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/HRIS-Candidate-v2/assets/[^"]+\.css"' dist/index.html
          test -n "$(find dist/assets -name '*.js' -print -quit)"
          test -n "$(find dist/assets -name '*.css' -print -quit)"
      # No SQL mutation, Pages deployment, Main HRIS modification or production secrets.
